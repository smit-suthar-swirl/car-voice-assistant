# Render Blueprint — one free web service + one free Postgres (with pgvector).
# No Redis needed (the app falls back to an in-memory cache).
databases:
  - name: car-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: car-voice-assistant
    runtime: node
    plan: free
    region: oregon
    # Free tier doesn't allow preDeployCommand, so run the DB release as part of
    # the build (DATABASE_URL + GEMINI_API_KEY are available at build time).
    buildCommand: npm run build && npm run release
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: car-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false          # set this in the Render dashboard
      - key: NODE_ENV
        value: production
